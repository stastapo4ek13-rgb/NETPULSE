name: Build NETPULSE EXE
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pyinstaller
      - run: pyinstaller --onefile --icon=netpulse.ico --name=NETPULSE netpulse.py
      - uses: actions/upload-artifact@v4
        with:
          name: NETPULSE-Windows
          path: dist/NETPULSE.exe
